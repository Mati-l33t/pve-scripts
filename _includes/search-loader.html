<!--
  Jekyll Simple Search loader
  See: <https://github.com/christian-fei/Simple-Jekyll-Search>
-->

{% capture result_elem %}
  <article class="px-1 px-sm-2 px-lg-4 px-xl-0">
    <header>
      <h2>
        {icon}<a href="{url}">{title}</a> {type}{dev}
      </h2>
      <div class="post-meta d-flex flex-column flex-sm-row text-muted mt-1 mb-1" style="padding-left:1.6em;">
        {categories}
      </div>
    </header>
    <p>{description}</p>
  </article>
{% endcapture %}

{% capture not_found %}<p class="mt-5">{{ site.data.locales[include.lang].search.no_results }}</p>{% endcapture %}

<script>
  {% comment %} Note: dependent library will be loaded in `js-selector.html` {% endcomment %}
  document.addEventListener('DOMContentLoaded', () => {
    SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('search-results'),
      json: '{{ '/assets/js/data/search.json' | relative_url }}',
      searchResultTemplate: '{{ result_elem | strip_newlines }}',
      noResultsText: '{{ not_found }}',
      limit: 50,
      templateMiddleware: function(prop, value, template) {
        if (prop === 'categories') {
          if (value === '') {
            return `${value}`;
          } else {
            return `<div class="me-sm-4"><i class="far fa-folder fa-fw"></i>${value}</div>`;
          }
        }

        if (prop === 'tags') {
          if (value === '') {
            return `${value}`;
          } else {
            return `<div><i class="fa fa-tag fa-fw"></i>${value}</div>`;
          }
        }

        if (prop === 'icon') {
          if (value === '') return '';
          return `<img src="${value}" alt="" style="width:1.1em;height:1.1em;object-fit:contain;vertical-align:middle;margin-right:0.5em;" onerror="this.style.display='none'">`;
        }

        if (prop === 'type') {
          const labels = { lxc: 'LXC', vm: 'VM', addon: 'ADDON', pve: 'PVE', turnkey: 'TURNKEY' };
          if (!value || !labels[value]) return '';
          return `<span class="type-badge type-${value}">${labels[value]}</span>`;
        }

        if (prop === 'dev') {
          return value === 'dev' ? `<span class="type-badge type-dev">DEV</span>` : '';
        }
      }
    });
  });
</script>
